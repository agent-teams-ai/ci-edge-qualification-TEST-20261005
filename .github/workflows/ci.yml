name: CI
run-name: TEST GITHUB_TOKEN suppression probe
on:
  workflow_dispatch:
    inputs:
      attest:
        description: Disposable TEST probe
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  token-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Confirm the token cannot establish a user identity
        shell: bash
        run: |
          if gh api user >/dev/null 2>token-user-error.txt; then
            echo "Unexpected usable user token" >&2
            exit 1
          fi
          grep -q '403' token-user-error.txt
          echo "GITHUB_TOKEN user preflight rejected with 403"
      - name: Demonstrate successful label write with suppressed workflow event
        shell: bash
        run: |
          gh api --method POST "repos/$REPOSITORY/issues/4/labels" -f 'labels[]=TEST-token-suppressed' --jq '.[].name'
