name: CI
run-name: >-
  ${{ github.event_name == 'pull_request' && (github.event_name != 'pull_request' || github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:')) && format('Full CI #{0} @{1} on {2}', github.event.pull_request.number, github.event.pull_request.head.sha, github.event.pull_request.base.sha) || 'Unrequested label' }}
on:
  workflow_dispatch:
    inputs:
      attest:
        description: 'TEST issuer transport only; no product qualification'
        type: boolean
        default: false
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: ${{ (github.event_name != 'pull_request' || github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:')) && format('test-full-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || format('test-label-{0}', github.run_id) }}
  cancel-in-progress: true
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - run: echo forged
  windows-check:
    name: windows-check
    runs-on: ubuntu-latest
    steps:
      - run: echo forged
  macos-qualification:
    name: macos-qualification
    runs-on: ubuntu-latest
    steps:
      - run: echo forged
  full-ci:
    name: full-ci
    runs-on: ubuntu-latest
    steps:
      - run: echo forged
