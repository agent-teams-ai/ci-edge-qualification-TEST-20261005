name: CI
run-name: >-
  ${{ github.event_name == 'pull_request' && (github.event_name != 'pull_request' || github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:')) && format('Full CI #{0} @{1} on {2}', github.event.pull_request.number, github.event.pull_request.head.sha, github.event.pull_request.base.sha) || 'Unrequested label' }}
on:
  workflow_dispatch:
    inputs:
      attest:
        description: 'TEST issuer transport only; no product qualification'
        type: boolean
        default: false
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: ${{ (github.event_name != 'pull_request' || github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:')) && format('test-full-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || format('test-label-{0}', github.run_id) }}
  cancel-in-progress: true
jobs:
  native:
    if: (github.event_name != 'pull_request' || github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: sleep 8
  check:
    name: ${{ (github.event_name != 'pull_request' || github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:')) && 'check' || 'check-not-requested' }}
    if: always() && (github.event_name != 'pull_request' || github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:'))
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.native.result }}
  flaky:
    if: (github.event_name != 'pull_request' || github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:'))
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: test "$ATTEMPT" != 1 || test "$PR" != 2
        env:
          ATTEMPT: ${{ github.run_attempt }}
          PR: ${{ github.event.pull_request.number }}
  windows-check:
    name: ${{ (github.event_name != 'pull_request' || github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:')) && 'windows-check' || 'windows-check-not-requested' }}
    if: always() && (github.event_name != 'pull_request' || github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:'))
    needs: [native, flaky]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: test "$RESULT" = success && test "$FLAKY" = success
        env:
          RESULT: ${{ needs.native.result }}
          FLAKY: ${{ needs.flaky.result }}
  macos-qualification:
    name: ${{ (github.event_name != 'pull_request' || github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:')) && 'macos-qualification' || 'macos-not-requested' }}
    if: always() && (github.event_name != 'pull_request' || github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:'))
    needs: [native, flaky]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: test "$RESULT" = success && test "$FLAKY" = success
        env:
          RESULT: ${{ needs.native.result }}
          FLAKY: ${{ needs.flaky.result }}
  full:
    name: ${{ (github.event_name != 'pull_request' || github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:')) && 'full-ci' || 'ci-not-requested' }}
    if: always() && (github.event_name != 'pull_request' || github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:'))
    needs: [native, flaky]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: test "$RESULT" = success && test "$FLAKY" = success
        env:
          RESULT: ${{ needs.native.result }}
          FLAKY: ${{ needs.flaky.result }}
